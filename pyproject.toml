[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relpy"
version = "2.0.0"
description = "A Python-native relational library with a native C storage + query engine, real SQL backends, and an HTTP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reuven Mandelovich" }]
keywords = ["relational", "database", "sql", "in-memory", "c-extension", "server", "analytics"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Operating System :: OS Independent",
]

# The core library has no required third-party dependencies. Encryption uses
# `cryptography`; the SQL backends use SQLAlchemy plus a driver. These are also
# installed automatically on first use (see RELPY_AUTO_INSTALL).
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
mysql = ["sqlalchemy>=2.0", "PyMySQL>=1.1"]
oracle = ["sqlalchemy>=2.0", "oracledb>=2.0"]
azure = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
pandas = ["pandas>=2.0", "numpy>=1.24"]
all = [
    "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "PyMySQL>=1.1",
    "oracledb>=2.0", "pyodbc>=5.0", "pandas>=2.0", "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/mandelreouven2002/RelPyDB"
Repository = "https://github.com/mandelreouven2002/RelPyDB"
Issues = "https://github.com/mandelreouven2002/RelPyDB/issues"

[project.scripts]
relpy-server = "relpy.server:main"

[tool.setuptools]
packages = ["relpy", "relpy.backends"]

[tool.setuptools.package-data]
relpy = ["_core_src/*.c"]
